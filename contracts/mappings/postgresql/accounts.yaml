# Design specification only; these rules and checkpoints are not executed by this YAML.
mapping_version: 2
source:
  system: banking-simulator
  type: postgresql
  database: bank
  schema: core_sim
  table: accounts
  contract: ../../sources/postgresql/core_sim/accounts.yaml
targets:
  bronze:
    catalog: lakehouse
    schema: bronze
    table: accounts
    write_mode: append
    grain: one row per source record observed in an ingestion batch
  silver:
    catalog: lakehouse
    schema: silver
    table: dim_accounts
    write_mode: merge
    grain: one current row per account
    business_key: [account_id]
  ingestion_metadata:
    - name: _source_system
      expression: "banking-simulator"
    - name: _source_schema
      expression: "core_sim"
    - name: _source_table
      expression: "accounts"
    - name: _ingested_at
      expression: ingestion timestamp in UTC
    - name: _batch_id
      expression: unique identifier of the ingestion batch
    - name: _ingestion_date
      expression: UTC date derived from _ingested_at
column_mappings:
  - source: id
    bronze: id
    silver: account_id
    transformation: rename; preserve UUID as business key
    nullable: false
  - source: customer_id
    bronze: customer_id
    silver: customer_id
    transformation: preserve nullable foreign key; exactly one owner column must be populated
    nullable: true
  - source: merchant_id
    bronze: merchant_id
    silver: merchant_id
    transformation: preserve nullable foreign key; exactly one owner column must be populated
    nullable: true
  - source: currency
    bronze: currency
    silver: currency
    transformation: validate VND
    nullable: false
  - source: opening_balance
    bronze: opening_balance
    silver: opening_balance_vnd
    transformation: rename; preserve non-negative whole-VND integer
    nullable: false
  - source: balance
    bronze: balance
    silver: balance_vnd
    transformation: rename; preserve non-negative whole-VND current balance
    nullable: false
  - source: created_at
    bronze: created_at
    silver: created_at
    transformation: preserve timestamp and normalize to UTC
    nullable: false
  - source: updated_at
    bronze: updated_at
    silver: updated_at
    transformation: preserve timestamp and normalize to UTC; incremental watermark
    nullable: false
quality_rules:
  - id: accounts_id_unique
    scope: source_snapshot_and_silver_current_state
    rule: id is unique within one source snapshot; account_id is unique in Silver current state
    action: quarantine conflicting source records; block publication if Silver uniqueness fails
  - id: accounts_exactly_one_owner
    rule: exactly one of customer_id and merchant_id is non-null
    action: quarantine violating records
  - id: accounts_owner_foreign_key
    rule: non-null owner ID references its customer or merchant row
    action: quarantine violating records
  - id: accounts_nonnegative_balances
    rule: opening_balance and balance are non-negative
    action: quarantine violating records
  - id: accounts_currency_vnd
    rule: currency is VND
    action: quarantine violating records
load_strategy:
  initial: full_snapshot
  subsequent: incremental_polling
  watermark_column: updated_at
  overlap: 5 minutes
  extraction_order: [updated_at, id]
  silver_merge_key: [account_id]
  checkpoint_scope: [system, database, schema, table]
  watermark_commit: only_after_bronze_append_and_accepted_batch_manifest_are_durable
  silver_processing_checkpoint: separately_track_consumed_bronze_snapshots_and_commit_after_silver_and_quarantine_writes_succeed
  notes:
    - repeated account IDs across Bronze observations are expected; source and Silver uniqueness rules do not apply across all Bronze rows
    - use updated_at to order versions; id orders different source records and cannot break ties between versions of the same account
    - identical payloads at the same updated_at may be deduplicated; conflicting payloads need an explicit source-version rule or quarantine, not arbitrary UUID ordering
    - persist the input Bronze snapshot IDs for replay and prevent an older source version from overwriting newer Silver state
    - serialize extraction per checkpoint scope; a downstream failure must be retried from durable Bronze without requiring extraction to remain uncommitted
    - a five-minute overlap is a tolerance, not a no-loss guarantee; commits delayed beyond it can be missed because updated_at is assigned before commit
    - use periodic full reconciliation or CDC for recovery from missed updates; account and transaction comparisons need a consistent snapshot or agreed cut-off
    - balance is current state and must not be treated as historical balance
    - if account SCD2 is enabled, track owner or currency changes separately; do not create a new dimension version for every balance update
    - timestamp polling does not detect hard deletes or intermediate values between runs
