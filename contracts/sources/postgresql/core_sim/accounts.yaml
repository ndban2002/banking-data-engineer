apiVersion: v3.2.0
kind: DataContract

id: urn:datacontract:postgresql:core_sim:accounts
name: accounts
version: 0.1.0
status: draft

description:
  purpose: >
    Current account state generated by the PostgreSQL banking simulator
    for batch ingestion and future CDC consumers.
  usage: >
    Interpret monetary values as whole Vietnamese dong (VND). Each account
    belongs to exactly one customer or one merchant.
  limitations: >
    This table contains current balances, not historical balance snapshots
    or a double-entry ledger. created_at and updated_at are database write
    times, not transaction business times. All data is synthetic.

# Endpoint metadata only; resolve placeholders in the consuming tool.
# Keep credentials and SSH configuration in the runtime environment.
servers:
  - server: core-sim-postgresql
    type: postgres
    environment: development
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: bank
    schema: core_sim

schema:
  - name: accounts
    logicalType: object
    physicalType: table
    physicalName: accounts
    description: >
      One row per account. Exactly one of customer_id and merchant_id is
      populated. The simulator seeds one account per customer or merchant.
    dataGranularityDescription: One row per account, identified by id.

    quality:
      - id: accounts_exactly_one_owner
        type: sql
        description: No account may have both owners or neither owner.
        query: |
          SELECT COUNT(*)
          FROM {object}
          WHERE (customer_id IS NULL) = (merchant_id IS NULL)
        mustBe: 0

    properties:
      - name: id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        primaryKey: true
        description: Stable unique identifier of the account.

      - name: customer_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: false
        description: >
          Customer owner; references core_sim.customers.id. Unique when
          populated. Must be null for merchant accounts.

      - name: merchant_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: false
        description: >
          Merchant owner; references core_sim.merchants.id. Unique when
          populated. Must be null for customer accounts.

      - name: currency
        logicalType: string
        physicalType: text
        required: true
        enum:
          - value: VND
        description: Currency code. Only VND is supported.

      - name: opening_balance
        logicalType: integer
        physicalType: bigint
        logicalTypeOptions:
          minimum: 0
          maximum: 9223372036854775807
        required: true
        description: >
          Initial balance in whole VND assigned when the account is seeded.
          Re-running seed does not replenish or overwrite this balance.

      - name: balance
        logicalType: integer
        physicalType: bigint
        logicalTypeOptions:
          minimum: 0
          maximum: 9223372036854775807
        required: true
        description: >
          Current available balance in whole VND. Successful payments and
          refunds update this value atomically; failed transactions do not.

      - name: created_at
        logicalType: timestamp
        physicalType: timestamptz
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        required: true
        description: >
          Database time when the account row was created. The simulator
          connection uses UTC; historical generation does not backdate this field.

      - name: updated_at
        logicalType: timestamp
        physicalType: timestamptz
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        required: true
        description: >
          Database time when the account row was last updated by the simulator.
          This is not a payment business timestamp.
