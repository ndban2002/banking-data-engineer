apiVersion: v3.2.0
kind: DataContract

id: urn:datacontract:postgresql:core_sim:merchants
name: merchants
version: 0.1.0
status: draft

description:
  purpose: >
    Current merchant state generated by the PostgreSQL banking simulator
    for batch ingestion and future CDC consumers.
  usage: >
    Merchant records identify simulated payment recipients and describe their
    category, region, and accepted QR/POS channel. Account balances are in
    core_sim.accounts.
  limitations: >
    This table contains merchant attributes only; it does not contain account
    balances or transaction history. All data is synthetic.

# Endpoint metadata only; resolve placeholders in the consuming tool.
# Keep credentials and SSH configuration in the runtime environment.
servers:
  - server: core-sim-postgresql
    type: postgres
    environment: development
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: bank
    schema: core_sim

schema:
  - name: merchants
    logicalType: object
    physicalType: table
    physicalName: merchants
    description: >
      One row per merchant. The simulator seeds one merchant per row.
    dataGranularityDescription: One row per merchant, identified by id.

    quality:
      - id: merchants_unique_id
        type: sql
        description: All merchant IDs must be unique.
        query: |
          SELECT COUNT(*)
          FROM {object}
          WHERE id IN (
            SELECT id
            FROM {object}
            GROUP BY id
            HAVING COUNT(*) > 1
          )
        mustBe: 0

    properties:
      - name: id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        primaryKey: true
        description: Stable unique identifier of the merchant.

      - name: name
        logicalType: string
        physicalType: text
        required: true
        description: Name of the merchant.

      - name: mcc
        logicalType: string
        physicalType: text
        required: true
        description: Four-digit merchant category code (MCC).

      - name: region
        logicalType: string
        physicalType: text
        required: true
        description: Synthetic region code, such as HA_NOI, DA_NANG, HO_CHI_MINH, or CAN_THO.

      - name: channel
        logicalType: string
        physicalType: text
        required: true
        enum:
          - value: QR
          - value: POS
        description: "Payment channel accepted by the merchant: QR or POS."

      - name: created_at
        logicalType: timestamp
        physicalType: timestamptz
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        required: true
        description: >
          Database write time of the row. Not a business transaction time.
