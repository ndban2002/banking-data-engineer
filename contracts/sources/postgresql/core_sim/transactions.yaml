apiVersion: v3.2.0
kind: DataContract

id: urn:datacontract:postgresql:core_sim:transactions
name: transactions
version: 0.1.0
status: draft

description:
  purpose: >
    Current transaction state generated by the PostgreSQL banking simulator
    for batch ingestion and future CDC consumers.
  usage: >
    Interpret amount as whole Vietnamese dong (VND). Payments transfer from a
    customer account to a merchant account; refunds reverse that direction.
  limitations: >
    Each row stores the latest status of a request, including its PENDING
    state; it is not a double-entry ledger. All data is synthetic.

# Endpoint metadata only; resolve placeholders in the consuming tool.
# Keep credentials and SSH configuration in the runtime environment.
servers:
  - server: core-sim-postgresql
    type: postgres
    environment: development
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: bank
    schema: core_sim

schema:
  - name: transactions
    logicalType: object
    physicalType: table
    physicalName: transactions
    description: >
      One row per payment or refund request. Successful refunds link to their
      original successful payment.
    dataGranularityDescription: One row per transaction, identified by id.

    quality:
      - id: transactions_unique_id
        type: sql
        description: All transaction IDs must be unique.
        query: |
          SELECT COUNT(*)
          FROM {object}
          WHERE id IN (
            SELECT id
            FROM {object}
            GROUP BY id
            HAVING COUNT(*) > 1
          )
        mustBe: 0
      - id: transactions_status_error_consistency
        type: sql
        description: Failed transactions have an error code; other statuses do not.
        query: |
          SELECT COUNT(*)
          FROM {object}
          WHERE (status = 'FAILED' AND error_code IS NULL)
             OR (status <> 'FAILED' AND error_code IS NOT NULL)
        mustBe: 0
      - id: transactions_refund_link_consistency
        type: sql
        description: Payments have no original transaction; refunds have one.
        query: |
          SELECT COUNT(*)
          FROM {object}
          WHERE (kind = 'PAYMENT' AND original_transaction_id IS NOT NULL)
             OR (kind = 'REFUND' AND original_transaction_id IS NULL)
        mustBe: 0

    properties:
      - name: id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        primaryKey: true
        description: Stable unique identifier of the transaction.

      - name: request_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        unique: true
        description: Stable unique identifier of the request that generated the transaction.

      - name: kind
        logicalType: string
        physicalType: text
        required: true
        enum:
          - value: PAYMENT
          - value: REFUND
        description: "Transaction type: PAYMENT or REFUND."

      - name: source_account_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        description: >
          Source account for the transfer. Customer for PAYMENT and merchant
          for REFUND. References core_sim.accounts.id.

      - name: destination_account_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        description: >
          Destination account for the transfer. Merchant for PAYMENT and
          customer for REFUND. References core_sim.accounts.id.

      - name: amount
        logicalType: integer
        physicalType: bigint
        logicalTypeOptions:
          exclusiveMinimum: 0
          maximum: 9223372036854775807
        required: true
        description: >
          Positive transaction amount in whole Vietnamese dong (VND).

      - name: currency
        logicalType: string
        physicalType: text
        required: true
        enum:
          - value: VND
        description: Currency code. Only VND is supported.

      - name: channel
        logicalType: string
        physicalType: text
        required: true
        enum:
          - value: QR
          - value: POS
        description: Channel code for the transaction.

      - name: status
        logicalType: string
        physicalType: text
        required: true
        description: Current lifecycle status of the transaction.
        enum:
          - value: PENDING
          - value: SUCCEEDED
          - value: FAILED

      - name: error_code
        logicalType: string
        physicalType: text
        required: false
        description: >
          Error code for FAILED transactions; null for PENDING and SUCCEEDED transactions.

      - name: original_transaction_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: false
        description: >
          Original transaction ID for refunds. Null for non-refund transactions.

      - name: requested_decline
        logicalType: boolean
        physicalType: boolean
        required: true
        description: >
          True when the load generator requested a simulated decline. This flag
          does not indicate other failure causes such as insufficient funds.
      
      - name: occurred_at
        logicalType: timestamp
        physicalType: timestamptz
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        required: true
        description: >
          Business time when the transaction occurred. This is the time of the actual transaction event, not the database write time.

      - name: created_at
        logicalType: timestamp
        physicalType: timestamptz
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        required: true
        description: >
          Database write time of the row. Not a business transaction time.

      - name: updated_at
        logicalType: timestamp
        physicalType: timestamptz
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        required: true
        description: >
          Database write time of the row. Not a business transaction time.
