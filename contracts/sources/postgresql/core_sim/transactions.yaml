apiVersion: v3.2.0
kind: DataContract

id: urn:datacontract:postgresql:core_sim:transactions
name: transactions
version: 0.1.0
status: draft

description:
  purpose: >
    Current transaction state generated by the PostgreSQL banking simulator
    for batch ingestion and future CDC consumers.
  usage: >
    Interpret monetary values as whole Vietnamese dong (VND). Each transaction
    involves exactly one customer and one merchant.
  limitations: >
    This table contains current transaction data, not historical snapshots
    or a double-entry ledger. created_at and updated_at are database write
    times, not transaction business times. All data is synthetic.

# Endpoint metadata only; resolve placeholders in the consuming tool.
# Keep credentials and SSH configuration in the runtime environment.
servers:
  - server: core-sim-postgresql
    type: postgres
    environment: development
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: bank
    schema: core_sim

schema:
  - name: transactions
    logicalType: object
    physicalType: table
    physicalName: transactions
    description: >
      One row per transaction. Each transaction involves exactly one customer
      and one merchant. The simulator seeds one transaction per row.
    dataGranularityDescription: One row per transaction, identified by id.

    quality:
      - id: transactions_unique_id
        type: sql
        description: All transaction IDs must be unique.
        query: |
          SELECT COUNT(*)
          FROM {object}
          WHERE id IN (
            SELECT id
            FROM {object}
            GROUP BY id
            HAVING COUNT(*) > 1
          )
        mustBe: 0

    properties:
      - name: id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        primaryKey: true
        description: Stable unique identifier of the transaction.

      - name: request_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        description: Stable unique identifier of the request that generated the transaction.

      - name: kind
        logicalType: string
        physicalType: text
        required: true
        description: Type of transaction, e.g. "purchase", "refund".

      - name: source_account_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        description: >
          Account ID of the source account (customer) for the transaction.
          References core_sim.accounts.id.

      - name: destination_account_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        description: >
          Account ID of the destination account (merchant) for the transaction.
          References core_sim.accounts.id.

      - name: amount
        logicalType: integer
        physicalType: int8
        logicalTypeOptions:
          minimum: 0
          maximum: 9223372036854775807
        required: true
        description: >
          Transaction amount in whole Vietnamese dong (VND). Must be non-negative.

      - name: currency
        logicalType: string
        physicalType: text
        required: true
        enum:
          - value: VND
        description: Currency code. Only VND is supported.

      - name: channel
        logicalType: string
        physicalType: text
        required: true
        description: Channel code for the transaction.

      - name: status
        logicalType: string
        physicalType: text
        required: true
        description: Status of the transaction, e.g. "pending", "completed", "failed".
        enum:
          - value: pending
          - value: completed
          - value: failed

      - name: error_code
        logicalType: string
        physicalType: text
        required: false
        description: >
          Error code if the transaction failed. Null if the transaction is pending or completed.

      - name: original_transaction_id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: false
        description: >
          Original transaction ID for refunds. Null for non-refund transactions.

      - name: request_decline
        logicalType: boolean
        physicalType: boolean
        required: true
        description: >
          True if the transaction was declined at the request level (e.g. invalid request, insufficient funds).
          False if the transaction was processed successfully or failed due to other reasons.
      
      - name: occured_at
        logicalType: string
        physicalType: timestamptz
        logicalTypeOptions:
          format: date-time
        required: true
        description: >
          Business time when the transaction occurred. This is the time of the actual transaction event, not the database write time.

      - name: created_at
        logicalType: string
        physicalType: timestamptz
        logicalTypeOptions:
          format: date-time
        required: true
        description: >
          Database write time of the row. Not a business transaction time.

      - name: updated_at
        logicalType: string
        physicalType: timestamptz
        logicalTypeOptions:
          format: date-time
        required: true
        description: >
          Database write time of the row. Not a business transaction time.
