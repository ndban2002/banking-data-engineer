apiVersion: v3.2.0
kind: DataContract

id: urn:datacontract:postgresql:core_sim:customers
name: customers
version: 0.1.0
status: draft

description:
  purpose: >
    Current customer state generated by the PostgreSQL banking simulator
    for batch ingestion and future CDC consumers.
  usage: >
    Customer records identify the simulated owners of customer accounts.
    The simulator currently seeds one account per customer.
  limitations: >
    This table contains customer attributes only; it does not contain account
    balances or transaction history. All data is synthetic.

# Endpoint metadata only; resolve placeholders in the consuming tool.
# Keep credentials and SSH configuration in the runtime environment.
servers:
  - server: core-sim-postgresql
    type: postgres
    environment: development
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: bank
    schema: core_sim

schema:
  - name: customers
    logicalType: object
    physicalType: table
    physicalName: customers
    description: >
      One row per customer. The simulator seeds one customer per row.
    dataGranularityDescription: One row per customer, identified by id.

    quality:
      - id: customers_unique_id
        type: sql
        description: All customer IDs must be unique.
        query: |
          SELECT COUNT(*)
          FROM {object}
          WHERE id IN (
            SELECT id
            FROM {object}
            GROUP BY id
            HAVING COUNT(*) > 1
          )
        mustBe: 0

    properties:
      - name: id
        logicalType: string
        physicalType: uuid
        logicalTypeOptions:
          format: uuid
        required: true
        primaryKey: true
        description: Stable unique identifier of the customer.

      - name: name
        logicalType: string
        physicalType: text
        required: true
        description: Full name of the customer.

      - name: region
        logicalType: string
        physicalType: text
        required: true
        description: Synthetic region code, such as HA_NOI, DA_NANG, HO_CHI_MINH, or CAN_THO.

      - name: created_at
        logicalType: timestamp
        physicalType: timestamptz
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        required: true
        description: >
          Timestamp of when the customer was created in the simulator database.
