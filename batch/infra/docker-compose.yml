name: banking-lakehouse

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [lakehouse]

  create-warehouse:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do sleep 2; done;
        until mc ready local >/dev/null 2>&1; do sleep 2; done;
        mc mb --ignore-existing local/warehouse
    networks: [lakehouse]

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    depends_on:
      create-warehouse:
        condition: service_completed_successfully
    user: "0:0"
    environment:
      CATALOG_CATALOG_NAME: lakehouse
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/iceberg_catalog.db?journal_mode=WAL
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CLIENT_REGION: us-east-1
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER:-minioadmin}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:${ICEBERG_REST_PORT:-8181}:8181"
    volumes:
      - iceberg-catalog:/var/lib/iceberg
    networks: [lakehouse]

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: banking-lakehouse-spark:3.5.6-iceberg-1.9.2
    depends_on:
      - iceberg-rest
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_CONF_DIR: /tmp/spark-conf
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SOURCE_PG_HOST: ${SOURCE_PG_HOST:-host.docker.internal}
      SOURCE_PG_PORT: ${SOURCE_PG_PORT:-15432}
      SOURCE_PG_DATABASE: ${SOURCE_PG_DATABASE:-bank}
      SOURCE_PG_SCHEMA: ${SOURCE_PG_SCHEMA:-core_sim}
      SOURCE_PG_USER: ${SOURCE_PG_USER:-}
      SOURCE_PG_PASSWORD: ${SOURCE_PG_PASSWORD:-}
    command:
      - /bin/bash
      - -lc
      - >-
        mkdir -p "$${SPARK_CONF_DIR}" &&
        envsubst '$$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD' < /opt/spark/conf/spark-defaults.conf.template
        > "$${SPARK_CONF_DIR}/spark-defaults.conf" &&
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "127.0.0.1:${SPARK_SQL_PORT:-10000}:10000"
    volumes:
      - ./bronze-smoke-test.sql:/opt/spark/work-dir/bronze-smoke-test.sql:ro
      - ./jobs:/opt/spark/work-dir/jobs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [lakehouse]

  spark-worker:
    image: banking-lakehouse-spark:3.5.6-iceberg-1.9.2
    build:
      context: .
      dockerfile: Dockerfile.spark
    command:
      - /bin/bash
      - -lc
      - >-
        mkdir -p "$${SPARK_CONF_DIR}" &&
        envsubst '$$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD' < /opt/spark/conf/spark-defaults.conf.template
        > "$${SPARK_CONF_DIR}/spark-defaults.conf" &&
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077 --cores "$${SPARK_WORKER_CORES}" --memory "$${SPARK_WORKER_MEMORY}"
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CONF_DIR: /tmp/spark-conf
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SOURCE_PG_HOST: ${SOURCE_PG_HOST:-host.docker.internal}
      SOURCE_PG_PORT: ${SOURCE_PG_PORT:-15432}
      SOURCE_PG_DATABASE: ${SOURCE_PG_DATABASE:-bank}
      SOURCE_PG_SCHEMA: ${SOURCE_PG_SCHEMA:-core_sim}
      SOURCE_PG_USER: ${SOURCE_PG_USER:-}
      SOURCE_PG_PASSWORD: ${SOURCE_PG_PASSWORD:-}
    ports:
      - "127.0.0.1:${SPARK_WORKER_UI_PORT:-8081}:8081"
    networks: [lakehouse]

volumes:
  minio-data:
  iceberg-catalog:

networks:
  lakehouse:
    name: banking-lakehouse
